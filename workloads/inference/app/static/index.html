<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR Workload</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --line: #e3e6ea;
    --text: #1b1f24; --muted: #6b7480; --accent: #2f6feb; --bad: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 16px; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    background: #e8eefc; color: var(--accent); font-size: 12px; font-weight: 600;
  }
  .badge.cpu { background: #eceef1; color: var(--muted); }
  #drop {
    background: var(--card); border: 2px dashed var(--line); border-radius: 10px;
    padding: 36px 16px; text-align: center; color: var(--muted); cursor: pointer;
  }
  #drop.over { border-color: var(--accent); background: #f2f6ff; color: var(--accent); }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-top: 16px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 600; }
  input[type=text] {
    font: inherit; padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--card); color: var(--text);
  }
  button {
    font: inherit; font-weight: 600; padding: 6px 12px; border-radius: 6px;
    border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer;
  }
  button.ghost { background: var(--card); color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .out {
    display: flex; gap: 8px; align-items: center; margin-bottom: 8px;
    background: #f2f5fb; border: 1px solid #d9e2f5; border-radius: 6px; padding: 8px;
  }
  .out code {
    flex: 1; min-width: 0; font-size: 13px; word-break: break-all;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .out button { flex: 0 0 auto; padding: 4px 10px; font-size: 12px; }
  .inline { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .inline .field { flex: 1 1 130px; }
  #summary { margin-top: 16px; color: var(--muted); }
  #summary b { color: var(--text); font-variant-numeric: tabular-nums; }
  .card { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; background: var(--card);
          border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card .thumbwrap { flex: 0 0 140px; }
  .card .body { flex: 1 1 260px; min-width: 0; }
  .card h2 { font-size: 13px; margin: 0 0 8px; font-weight: 600;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thumb { width: 140px; border-radius: 6px; display: block; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-size: 12px; font-weight: 600; }
  td.conf { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats { margin-top: 8px; color: var(--muted); font-size: 12px; }
  .stats b { color: var(--text); font-variant-numeric: tabular-nums; }
  .error { color: var(--bad); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>OCR Workload <span id="device" class="badge">device 확인 중…</span></h1>
  <div class="sub">영수증 이미지를 올리면 PaddleOCR로 텍스트를 인식합니다. 여러 장을 한 번에 올릴 수 있습니다. (jpg / jpeg / png)</div>

  <div id="drop">
    이미지를 끌어다 놓거나 클릭해서 선택하세요 · 여러 장 선택 가능
    <input type="file" id="file" accept="image/jpeg,image/png" multiple hidden>
  </div>

  <div class="controls">
    <button id="copyAll" class="ghost" disabled>전체 복사</button>
    <button id="downloadAll" class="ghost" disabled>전체 다운로드</button>
  </div>

  <div id="summary"></div>
  <div id="cards"></div>

  <div class="hint">API를 직접 호출하려면 <a href="/docs">/docs</a> (Swagger UI)를 사용하세요.</div>
</div>

<script>
const drop = document.getElementById("drop");
const fileInput = document.getElementById("file");
const summary = document.getElementById("summary");
const cards = document.getElementById("cards");
const copyAllBtn = document.getElementById("copyAll");
const downloadAllBtn = document.getElementById("downloadAll");

// 카드별 상태. [전체 복사]가 여기서 문자열을 모은다.
const items = [];

// 서버가 실제로 무엇 위에서 도는지 보여 준다.
fetch("/info").then(r => r.json()).then(info => {
  const badge = document.getElementById("device");
  badge.textContent = info.device;
  badge.className = "badge cpu";
}).catch(() => {
  document.getElementById("device").textContent = "device 알 수 없음";
});

drop.addEventListener("click", () => fileInput.click());
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => {
  e.preventDefault();
  drop.classList.remove("over");
  sendAll(e.dataTransfer.files);
});
fileInput.addEventListener("change", () => sendAll(fileInput.files));

downloadAllBtn.addEventListener("click", async () => {
  const label = downloadAllBtn.textContent;
  downloadAllBtn.disabled = true;
  for (const item of items) {
    downloadFile(item.file, downloadName(item.file, item.code.textContent));
    // 브라우저가 연속 다운로드를 막지 않도록 약간 간격을 둔다.
    await new Promise(resolve => setTimeout(resolve, 300));
  }
  downloadAllBtn.textContent = `${items.length}건 저장됨`;
  setTimeout(() => { downloadAllBtn.textContent = label; downloadAllBtn.disabled = false; }, 1500);
});

copyAllBtn.addEventListener("click", () => {
  const lines = items.map(item => item.code.textContent).filter(Boolean);
  copyText(lines.join("\n"), copyAllBtn, `${lines.length}건 복사됨`);
});

/**
 * 이미지 한 장당 요청 하나를 만들어 한꺼번에 띄운다.
 * 실제로 몇 개가 병렬로 도는지는 서버가 정한다(OCR_MAX_CONCURRENCY).
 * 그래서 아래의 전체 소요 시간에는 실제 대기 동작이 그대로 반영된다.
 */
async function sendAll(fileList) {
  const files = Array.from(fileList);
  if (files.length === 0) return;

  cards.innerHTML = "";
  items.length = 0;
  copyAllBtn.disabled = true;
  downloadAllBtn.disabled = true;
  summary.innerHTML = `<b>${files.length}</b>장 인식 중…`;

  const startedAt = performance.now();
  const results = await Promise.all(files.map(file => sendOne(file)));
  const wallClockMs = performance.now() - startedAt;

  const ok = results.filter(r => r.payload);
  const totalTexts = ok.reduce((sum, r) => sum + r.payload.count, 0);
  const totalInferenceMs = ok.reduce((sum, r) => sum + r.payload.elapsed_ms, 0);

  copyAllBtn.disabled = items.length === 0;
  downloadAllBtn.disabled = items.length === 0;
  summary.innerHTML =
    `<b>${ok.length}</b>/<b>${files.length}</b>장 성공 · ` +
    `텍스트 <b>${totalTexts}</b>건 · ` +
    `추론 합계 <b>${totalInferenceMs.toFixed(1)}</b>ms · ` +
    `실제 경과 <b>${wallClockMs.toFixed(1)}</b>ms`;
}

async function sendOne(file) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="thumbwrap"><img class="thumb" alt=""></div>
    <div class="body"><h2></h2><div class="slot">인식 중…</div></div>`;
  card.querySelector(".thumb").src = URL.createObjectURL(file);
  card.querySelector("h2").textContent = file.name;
  cards.appendChild(card);

  const slot = card.querySelector(".slot");
  const body = new FormData();
  body.append("file", file);

  const startedAt = performance.now();
  let response;
  try {
    response = await fetch("/ocr", { method: "POST", body });
  } catch (err) {
    slot.innerHTML = `<div class="error">요청 실패: ${escapeHtml(String(err))}</div>`;
    return { file, payload: null };
  }
  const roundTripMs = performance.now() - startedAt;

  const payload = await response.json();
  if (!response.ok) {
    slot.innerHTML = `<div class="error">${response.status} — ${escapeHtml(String(payload.detail))}</div>`;
    return { file, payload: null };
  }

  renderCard(slot, file, payload, roundTripMs);
  return { file, payload };
}

// --- 영수증에서 항목 뽑기 ----------------------------------------------------

// 결제일시로 볼 수 있는 라벨. 영수증마다 표현이 달라 넓게 잡는다.
const PAID_AT_LABEL = /(결제|거래|승인|매출|구매)\s*(일시|일자|시각|시간)|일\s*시|거래일/;

/** YY.MM.DD로 정규화. 달/일이 범위를 벗어나면 빈 문자열. */
function formatDate(year, month, day) {
  const yy = String(year).slice(-2);
  const mm = String(month).padStart(2, "0");
  const dd = String(day).padStart(2, "0");
  if (+mm < 1 || +mm > 12 || +dd < 1 || +dd > 31) return "";
  return `${yy}.${mm}.${dd}`;
}

/**
 * 날짜와 시각을 한 덩어리로 잡는다.
 * PaddleOCR은 "결제일시 2026-08-05 12:34"를 "결제일시:2026-08-0512:34"처럼
 * 공백 없이 붙여서 내놓는 경우가 많아, 날짜 뒤에 시각이 바로 이어지는 것을 허용해야 한다.
 */
const DATETIME_RE = /(?:^|[^\d])(\d{4}|\d{2})[-./](\d{1,2})[-./](\d{1,2})\s*(?:([01]?\d|2[0-3]):([0-5]\d))?/g;

/** 문자열 어딘가에 따로 떨어져 있는 HH:MM에서 시(hour)만 뽑는다. */
function findHour(text) {
  const m = text.match(/(?:^|[^\d])([01]?\d|2[0-3]):([0-5]\d)(?::[0-5]\d)?(?!\d)/);
  return m ? Number(m[1]) : null;
}

/** 한 덩어리의 문자열에서 날짜와 시(hour)를 찾는다. */
function findDateTime(text) {
  // 2026년 9월 13일 (+ 뒤따르는 시각)
  const korean = text.match(/(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일\s*(?:([01]?\d|2[0-3]):([0-5]\d))?/);
  if (korean) {
    const date = formatDate(korean[1], korean[2], korean[3]);
    if (date) {
      return { date, hour: korean[4] !== undefined ? Number(korean[4]) : findHour(text) };
    }
  }

  // 2026-08-05 / 26.08.05 / 2026-08-0512:34
  // 사업자번호(120-87-65763)처럼 날짜가 아닌 숫자에 걸릴 수 있으므로
  // 후보를 전부 훑으면서 달/일이 유효한 첫 번째 것을 쓴다.
  for (const m of text.matchAll(DATETIME_RE)) {
    const date = formatDate(m[1], m[2], m[3]);
    if (!date) continue;
    return { date, hour: m[4] !== undefined ? Number(m[4]) : findHour(text) };
  }

  return { date: "", hour: findHour(text) };
}

/**
 * 결제일시를 찾는다.
 * 라벨이 붙은 줄(과 뒤따르는 2줄)을 먼저 보고, 없으면 전체에서 처음 나오는 날짜를 쓴다.
 */
function extractPaidAt(texts) {
  for (let i = 0; i < texts.length; i++) {
    if (!PAID_AT_LABEL.test(texts[i])) continue;
    const found = findDateTime(texts.slice(i, i + 3).join(" "));
    if (found.date) return found;
  }
  for (let i = 0; i < texts.length; i++) {
    const found = findDateTime(texts.slice(i, i + 2).join(" "));
    if (found.date) return found;
  }
  return { date: "", hour: null };
}

/** 17시 이후면 저녁, 이전이면 점심. 시각을 못 찾으면 점심으로 둔다. */
function purposeFromHour(hour) {
  return hour !== null && hour >= 17 ? "저녁" : "점심";
}

// 영수증의 두 섹션. 가맹점(결제 주체)과 판매자(실제 매장)의 상호가 다를 수 있다.
const MERCHANT_SECTION = /가\s*맹\s*점/;
const SELLER_SECTION = /판\s*매\s*자|공\s*급\s*자/;

/** texts[start, end) 구간에서 '상호' 값을 찾는다. 같은 줄에 없으면 다음 줄을 쓴다. */
function tradeNameIn(texts, start, end) {
  for (let i = start; i < end; i++) {
    if (!/상\s*호/.test(texts[i])) continue;
    const inline = texts[i].replace(/^.*상\s*호\s*(명)?\s*[:：]?\s*/, "").trim();
    if (inline) return inline;
    const next = (texts[i + 1] || "").trim();
    if (next) return next;
  }
  return "";
}

function firstWord(text) {
  return (text || "").trim().split(/\s+/)[0] || "";
}

/** 두 섹션의 시작 위치. 한쪽 구간이 다른 쪽을 침범하지 않도록 경계로 쓴다. */
function sectionBounds(texts) {
  return {
    merchantAt: texts.findIndex(t => MERCHANT_SECTION.test(t)),
    sellerAt: texts.findIndex(t => SELLER_SECTION.test(t)),
  };
}

/** 가맹점 정보의 상호. 예: (주)우아한형제들 */
function extractMerchant(texts) {
  const { merchantAt, sellerAt } = sectionBounds(texts);
  if (merchantAt !== -1) {
    const end = sellerAt > merchantAt ? sellerAt : texts.length;
    const name = tradeNameIn(texts, merchantAt, end);
    if (name) return name;
  }
  // 가맹점 섹션이 없으면 판매자 섹션 앞쪽에서만 찾는다(판매자 상호를 끌어오지 않도록).
  return tradeNameIn(texts, 0, sellerAt === -1 ? texts.length : sellerAt);
}

/** 판매자 정보의 상호 중 첫 번째 단어. 예: '메머드 익스프레스 강남점' -> '메머드' */
function extractSeller(texts) {
  const { merchantAt, sellerAt } = sectionBounds(texts);
  if (sellerAt !== -1) {
    const end = merchantAt > sellerAt ? merchantAt : texts.length;
    const name = tradeNameIn(texts, sellerAt, end);
    if (name) return firstWord(name);
  }
  // 판매자 섹션이 없으면 영수증 첫 줄(매장 표시명)을 쓴다.
  return firstWord(texts[0] || "");
}

function buildName(date, merchant, purpose, store) {
  return `${date}${merchant}_${purpose}_${store}`;
}

// --- 렌더링 -----------------------------------------------------------------

function renderCard(slot, file, payload, roundTripMs) {
  const texts = payload.text.map(t => t.text);
  const paidAt = extractPaidAt(texts);

  slot.innerHTML = `
    <div class="out"><code></code><button type="button" class="b-copy">복사</button><button type="button" class="b-download ghost">다운로드</button></div>
    <div class="inline">
      <div class="field"><label>날짜</label><input type="text" class="f-date"></div>
      <div class="field"><label>가맹점</label><input type="text" class="f-merchant"></div>
      <div class="field"><label>용도</label><input type="text" class="f-purpose"></div>
      <div class="field"><label>판매자</label><input type="text" class="f-store"></div>
    </div>
    ${renderTable(payload, roundTripMs)}`;

  const code = slot.querySelector("code");
  const fields = {
    date: slot.querySelector(".f-date"),
    merchant: slot.querySelector(".f-merchant"),
    purpose: slot.querySelector(".f-purpose"),
    store: slot.querySelector(".f-store"),
  };

  fields.date.value = paidAt.date;
  fields.merchant.value = extractMerchant(texts);
  fields.purpose.value = purposeFromHour(paidAt.hour);
  fields.store.value = extractSeller(texts);

  const update = () => {
    code.textContent = buildName(
      fields.date.value.trim(),
      fields.merchant.value.trim(),
      fields.purpose.value.trim(),
      fields.store.value.trim(),
    );
  };
  for (const field of Object.values(fields)) field.addEventListener("input", update);
  update();

  items.push({ code, file });

  const copyBtn = slot.querySelector(".b-copy");
  copyBtn.addEventListener("click", () => copyText(code.textContent, copyBtn, "복사됨"));

  const downloadBtn = slot.querySelector(".b-download");
  downloadBtn.addEventListener("click", () => {
    downloadFile(file, downloadName(file, code.textContent));
    const label = downloadBtn.textContent;
    downloadBtn.textContent = "저장됨";
    setTimeout(() => { downloadBtn.textContent = label; }, 1200);
  });
}

function renderTable(payload, roundTripMs) {
  const stats =
    `<div class="stats"><b>${payload.count}</b>건 · ` +
    `추론 <b>${payload.elapsed_ms.toFixed(1)}</b>ms · ` +
    `응답 <b>${roundTripMs.toFixed(1)}</b>ms</div>`;

  if (payload.count === 0) {
    return `<div class="sub">인식된 텍스트가 없습니다.</div>${stats}`;
  }
  const rows = payload.text.map(item =>
    `<tr><td>${escapeHtml(item.text)}</td><td class="conf">${item.confidence.toFixed(3)}</td></tr>`
  ).join("");
  return `<table><thead><tr><th>텍스트</th><th class="conf">신뢰도</th></tr></thead>` +
         `<tbody>${rows}</tbody></table>${stats}`;
}

// --- 다운로드 ---------------------------------------------------------------

// 파일명에 쓸 수 없는 문자. 상호에 섞여 들어와도 저장이 실패하지 않게 걷어낸다.
const ILLEGAL_IN_FILENAME = /[\\/:*?"<>|\u0000-\u001f]/g;

/** 생성된 이름 + 원본 확장자. 이름이 비면 원본 파일명을 그대로 쓴다. */
function downloadName(file, base) {
  const ext = (file.name.match(/\.[^./\\]+$/) || [""])[0];
  const safe = base.replace(ILLEGAL_IN_FILENAME, "").trim();
  return safe ? safe + ext : file.name;
}

/** 업로드한 원본 파일을 그대로, 이름만 바꿔서 저장한다. */
function downloadFile(file, name) {
  const url = URL.createObjectURL(file);
  const link = document.createElement("a");
  link.href = url;
  link.download = name;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// --- 복사 -------------------------------------------------------------------

async function copyText(text, button, doneLabel) {
  if (!text) return;
  const original = button.textContent;
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    // http로 열었거나 권한이 없을 때의 폴백
    const area = document.createElement("textarea");
    area.value = text;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
  button.textContent = doneLabel;
  setTimeout(() => { button.textContent = original; }, 1200);
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}
</script>
</body>
</html>
