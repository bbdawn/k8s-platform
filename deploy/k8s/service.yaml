apiVersion: v1
kind: Service
metadata:
  name: ocr
  labels:
    app: ocr
spec:
  # ClusterIP가 아니라 NodePort다. <노드IP>:30800으로 바로 열어 볼 수 있고,
  # kubectl port-forward도 그대로 쓸 수 있다.
  type: NodePort
  selector:
    app: ocr
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30800
