apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr
  labels:
    app: ocr
spec:
  replicas: 1
  # maxSurge: 0 이 핵심이다. 기본값 RollingUpdate 는 예전 파드를 내리기 전에 새
  # 파드를 띄우는데, 그러면 측정 대상 노드가 잠시 workload 두 벌을 동시에 돌리게
  # 되어 CPU 를 나눠 쓴다. 벤치마크에서는 그 순간의 수치가 통째로 오염된다.
  #
  # 첫 클러스터(2코어 worker)에서는 그 두 번째 몫을 노드가 감당하지 못해 rollout
  # 이 교착되기까지 했다:
  #   0/3 nodes are available: 1 Insufficient cpu, 1 Insufficient memory, ...
  # 그래서 그때는 Recreate 를 썼다. 지금은 8코어 2대라 여유가 있지만, 그래도
  # surge 를 0 으로 두는 편이 맞다 - 자원 때문이 아니라 측정 때문이다.
  # 파드를 먼저 내리고 새로 띄우므로 교체 중 잠깐 끊기는데, 여기서 무중단은
  # 아무 가치가 없다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ocr
  template:
    metadata:
      labels:
        app: ocr
    spec:
      # 측정 대상 노드에만 파드를 올린다. 고정하지 않으면 파드가 cp 쪽으로 샐
      # 수 있고(지금은 taint 가 막지만 taint 를 풀면 샌다), 측정 대상이 아닌
      # 머신의 수치가 섞인다.
      #
      # 첫 클러스터에서는 "이미지가 그 노드에만 있어서" 고정이 필수였다. 이제는
      # 레지스트리가 있어서 어느 노드든 받아올 수 있으므로, 고정의 이유가
      # 이미지 배포가 아니라 측정 범위로 바뀌었다.
      #
      # kubernetes.io/hostname이 아니라 역할 label을 쓴다. 매니페스트에 머신
      # 이름이 들어가면 파일이 그 머신에 묶여서, workload를 옮길 때마다 파일을
      # 고쳐야 한다. 실제로 그것 때문에 배포할 때마다 이 파일을 수정했다.
      # label은 어느 노드가 "측정 대상" 역할을 맡는지를 말하므로, 옮기는 일이
      # 클러스터 작업이 된다:
      #
      #   kubectl label node <이전> ocr-bench/role-
      #   kubectl label node <새것> ocr-bench/role=target
      #
      # 누군가 붙이기 전까지는 어느 노드에도 이 label이 없다. 그래서 준비되지
      # 않은 클러스터에서는 파드가 Pending에 머물고 "didn't match node selector"
      # 라는 읽을 수 있는 event가 남는다. 엉뚱한 노드에 떴다가 image pull에서
      # 죽는 것보다 낫다. label을 받은 노드에는 이미지가 있어야 한다.
      nodeSelector:
        ocr-bench/role: target
      # replica 를 worker 2대에 고르게 나눈다. 없으면 scheduler 가 한쪽에
      # 몰아넣을 수 있고, 그러면 "파드 4개"라고 적어 놓고 실제로는 한 머신에서
      # 4개가 CPU 를 나눠 쓴 수치를 재게 된다. 파드 개수를 축으로 삼는 이
      # 벤치마크에서는 배치가 곧 측정 조건이다.
      #
      # maxSkew: 1 - 두 노드의 파드 수 차이가 1을 넘지 못한다. 그래서
      # 1 -> (1,0), 2 -> (1,1), 4 -> (2,2), 8 -> (4,4) 로 떨어진다.
      # DoNotSchedule - 못 지키면 스케줄하지 않는다. 조용히 한쪽에 몰리느니
      # Pending 으로 남아 눈에 띄는 쪽이 낫다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: ocr
      # Dockerfile의 APP_UID build arg와 같아야 한다. 이미지는 그 사용자의 HOME
      # 아래에 OCR 모델을 굽고 소유권도 그 사용자에게 넘긴다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: ocr
          image: ocr-workload:0.1.0-cpu
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ocr-config
          # requests 와 limits 를 양쪽 다 같게 맞추면 파드가 Guaranteed QoS 등급이
          # 되어, 노드가 쪼들릴 때 가장 나중에 밀려난다. 벤치마크는 어차피 자원이
          # 고정돼야 수치가 흔들리지 않는다.
          #
          # 숫자는 "파드 8개"라는 목표에서 나온다. worker 2대(각 8 vCPU / 16GB)에
          # kube-reserved 500m+512Mi, system-reserved 500m+1Gi, eviction 500Mi 를
          # 떼면 allocatable 이 노드당 약 7 vCPU / 14Gi 다. 여기에 calico-node 와
          # kube-proxy 몫을 빼고 4개씩 나누면:
          #
          #   cpu    6,000m / 4 = 1,500m   (노드당 1코어 남음)
          #   memory    12Gi / 4 = 3Gi     (노드당 2Gi 남음)
          #
          # memory 3Gi 가 입력 해상도를 결정한다. server 검출의 피크 메모리가
          # 입력 픽셀 수에 비례하기 때문이다. configmap 의 OCR_MAX_IMAGE_SIDE
          # 주석에 역산식이 있다.
          #
          # limits 를 노드 allocatable 보다 작게 두는 것이 중요하다. 첫 클러스터
          # 에서 4Gi(allocatable 3,810Mi)로 뒀더니, 컨테이너가 자기 한도에 닿기
          # 전에 노드가 먼저 말랐다. 그 죽음은 probe 실패를 동반한 SIGTERM/Error
          # 로 나타나서 probe 문제처럼 읽혔다. 한도를 allocatable 아래로 두면
          # 같은 초과가 이 컨테이너의 깔끔한 OOMKilled 로 나온다.
          # 낮게 틀리면 원인이 읽히고, 높게 틀리면 안 읽힌다.
          resources:
            requests:
              cpu: "1500m"
              memory: 3Gi
            limits:
              cpu: "1500m"
              memory: 3Gi
          # 엔드포인트를 둘로 나눠 둔 것은 의도다:
          #   /ready   OCR 엔진이 올라오기 전까지 503
          #   /health  프로세스만 떠 있으면 엔진과 무관하게 200
          #
          # startup과 readiness는 /ready를 봐야 한다. /health를 보게 하면 즉시
          # 통과해 버려서, 엔진 초기화가 실패한 파드도 Ready로 표시되고 503밖에
          # 못 내놓는 트래픽을 받는다. 드러나야 할 실패가 오히려 숨고, 벤치마크는
          # 죽은 엔진을 측정하게 된다.
          #
          # liveness는 /ready를 보면 **안 된다.** 엔진 초기화는 기동 때 한 번뿐이고
          # 재시도가 없어서, 실패한 엔진이면 파드가 무한히 재시작만 하고 진단할
          # 기회가 사라진다.
          #
          # CPU에서는 모델 로드와 워밍업 추론에 수십 초가 든다. startup probe가
          # 그 시간을 흡수해 주므로, 이후 liveness는 촘촘하게 두어도 기동 중인
          # 파드를 죽이지 않는다.
          #
          # timeoutSeconds를 셋 다 5로 둔 이유: 기본값이 1초인데, CPU가 포화된
          # 컨테이너는 아무리 가벼운 핸들러라도 1초 안에 답하지 못한다. 그 기본값
          # 때문에 이 파드가 반복해서 죽었다.
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
