apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr
  labels:
    app: ocr
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate. RollingUpdate starts the new pod
  # before retiring the old one, but nodeSelector pins both to the same node,
  # so the replacement asks that node for a second cpu:1/memory:2Gi it does not
  # have. The new pod stays Pending, the old one waits for it to become Ready,
  # and the rollout deadlocks - a 2-core worker hit this on the first redeploy:
  #   0/3 nodes are available: 1 Insufficient cpu, 1 Insufficient memory, ...
  # Zero-downtime is worthless here anyway, and two copies of the workload
  # briefly sharing the measured node's CPU would be actively harmful.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ocr
  template:
    metadata:
      labels:
        app: ocr
    spec:
      # Pin to the node the image was built on. There is no registry, so the
      # image exists on exactly one node and any other node gives
      # ErrImageNeverPull. It is also required for measurement: unpinned
      # replicas spread across workers and mix numbers from two machines.
      #
      # A role label, not kubernetes.io/hostname. A hostname in a manifest ties
      # the file to one machine - moving the workload then means editing, and
      # this file was edited on every deploy because of it. The label says which
      # node plays the "measured" role, so moving is a cluster-side operation:
      #
      #   kubectl label node <old> ocr-bench/role-
      #   kubectl label node <new> ocr-bench/role=target
      #
      # No node carries the label until someone sets it, so an unprepared
      # cluster leaves the pod Pending with a readable "didn't match node
      # selector" event - better than landing on the wrong node and dying on an
      # image pull. Whichever node gets the label must have the image on it.
      nodeSelector:
        ocr-bench/role: target
      # Must match the Dockerfile's APP_UID build arg: the image bakes the OCR
      # models under that user's HOME and chowns them to it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: ocr
          image: ocr-workload:0.1.0-cpu
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ocr-config
          # Measured, not guessed: the container peaked at 1282Mi (memory.peak
          # in its cgroup) while the node reports 3810Mi allocatable.
          #
          # requests == limits on both axes puts the pod in the Guaranteed QoS
          # class, so it is the last thing evicted under node pressure - and a
          # benchmark needs fixed resources anyway, or the numbers move.
          #
          # cpu is 1500m, not 2. The node has exactly 2 allocatable cores and
          # nothing is kube-reserved, so a pod allowed 2 cores can starve
          # kubelet, containerd and Calico. That is not theory: it happened.
          # The probes below timed out against a pegged container and kubelet
          # killed it:
          #   Liveness probe failed: ... context deadline exceeded
          #   Killing: Container ocr failed liveness probe, will be restarted
          # Leaving 500m for the system is what stops that.
          #
          # memory is 3Gi. 2560Mi was not enough: recognition on a 1200x1600
          # image went over it and the container was OOMKilled mid-request.
          #
          # Keep it under allocatable (3810Mi on this node), which is the whole
          # point. The original 4Gi was *larger* than the node could give, so an
          # overrun starved the node before the container hit its own limit -
          # the kill then showed up as SIGTERM/Error with failing probes, which
          # reads like a probe problem and is not one. Under allocatable, the
          # same overrun is a clean OOMKilled on this container. Being wrong on
          # the low side leaves a readable cause; being wrong on the high side
          # does not.
          #
          # ~740Mi is left for calico, kube-proxy and the eviction threshold.
          # There is not much room above this on a 4GB node.
          resources:
            requests:
              cpu: "1500m"
              memory: 3Gi
            limits:
              cpu: "1500m"
              memory: 3Gi
          # Two endpoints on purpose:
          #   /ready  503 until the OCR engine is loaded
          #   /health 200 as soon as the process is up, engine or not
          #
          # Startup and readiness must use /ready. Pointed at /health they pass
          # immediately, so a pod whose engine failed to initialize is marked
          # Ready and gets traffic it can only answer with 503 - the failure
          # hides instead of showing up, and a benchmark measures a dead engine.
          #
          # Liveness must NOT use /ready: engine init happens once at startup
          # and is never retried, so a failed engine would restart the pod
          # forever instead of leaving it up to be diagnosed.
          #
          # Model load plus the warm-up inference takes tens of seconds on CPU.
          # The startup probe absorbs that so liveness can stay tight afterwards
          # without killing a pod that is merely still booting.
          #
          # timeoutSeconds is 5 everywhere because the default is 1, and one
          # second is not enough for a CPU-saturated container to answer even a
          # trivial handler. That default is what killed this pod repeatedly.
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
