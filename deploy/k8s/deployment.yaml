apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr
  labels:
    app: ocr
spec:
  replicas: 1
  # 기본값 RollingUpdate가 아니라 Recreate다. RollingUpdate는 예전 파드를 내리기
  # 전에 새 파드를 띄우는데, nodeSelector가 둘 다 같은 노드에 묶어 두므로 새
  # 파드가 그 노드에 두 번째 몫을 요구하게 된다. 노드에 그만한 여유가 없으면 새
  # 파드는 Pending, 예전 파드는 새 파드가 Ready 되기를 기다려 rollout이 교착된다.
  # 2코어 worker에서 첫 재배포에 실제로 걸렸다:
  #   0/3 nodes are available: 1 Insufficient cpu, 1 Insufficient memory, ...
  # 여기서 무중단은 아무 가치가 없고, 측정 대상 노드에서 workload 두 벌이 잠시
  # 라도 CPU를 나눠 쓰는 것은 오히려 해롭다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ocr
  template:
    metadata:
      labels:
        app: ocr
    spec:
      # 이미지를 빌드한 노드에 파드를 고정한다. 레지스트리가 없어서 이미지가
      # 정확히 한 노드에만 있고, 다른 노드에 뜨면 ErrImageNeverPull이 난다.
      # 측정을 위해서도 필요하다. 고정하지 않으면 replica가 worker들에 흩어져
      # 서로 다른 머신의 수치가 섞인다.
      #
      # kubernetes.io/hostname이 아니라 역할 label을 쓴다. 매니페스트에 머신
      # 이름이 들어가면 파일이 그 머신에 묶여서, workload를 옮길 때마다 파일을
      # 고쳐야 한다. 실제로 그것 때문에 배포할 때마다 이 파일을 수정했다.
      # label은 어느 노드가 "측정 대상" 역할을 맡는지를 말하므로, 옮기는 일이
      # 클러스터 작업이 된다:
      #
      #   kubectl label node <이전> ocr-bench/role-
      #   kubectl label node <새것> ocr-bench/role=target
      #
      # 누군가 붙이기 전까지는 어느 노드에도 이 label이 없다. 그래서 준비되지
      # 않은 클러스터에서는 파드가 Pending에 머물고 "didn't match node selector"
      # 라는 읽을 수 있는 event가 남는다. 엉뚱한 노드에 떴다가 image pull에서
      # 죽는 것보다 낫다. label을 받은 노드에는 이미지가 있어야 한다.
      nodeSelector:
        ocr-bench/role: target
      # Dockerfile의 APP_UID build arg와 같아야 한다. 이미지는 그 사용자의 HOME
      # 아래에 OCR 모델을 굽고 소유권도 그 사용자에게 넘긴다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: ocr
          image: ocr-workload:0.1.0-cpu
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ocr-config
          # 감이 아니라 실측값이다. 컨테이너 cgroup의 memory.peak이 1282Mi였고
          # 노드 allocatable은 3810Mi다.
          #
          # requests와 limits를 양쪽 다 같게 맞추면 파드가 Guaranteed QoS 등급이
          # 되어, 노드가 쪼들릴 때 가장 나중에 밀려난다. 벤치마크는 어차피 자원이
          # 고정돼야 수치가 흔들리지 않는다.
          #
          # cpu가 2가 아니라 1500m인 이유: 이 노드의 allocatable이 정확히 2코어인데
          # kube-reserved가 설정돼 있지 않다. 2코어를 다 쓸 수 있는 파드는 kubelet,
          # containerd, Calico를 굶길 수 있다. 가정이 아니라 실제로 일어났다.
          # 아래 probe들이 포화된 컨테이너를 상대로 타임아웃 나고 kubelet이 죽였다:
          #   Liveness probe failed: ... context deadline exceeded
          #   Killing: Container ocr failed liveness probe, will be restarted
          # 시스템 몫으로 500m를 남기는 것이 이를 막는다.
          #
          # memory는 3Gi. 2560Mi로는 모자랐다. 1200x1600 이미지의 인식 단계가
          # 그 한도를 넘겨 요청 처리 도중 OOMKilled로 죽었다.
          #
          # allocatable(이 노드에서 3810Mi)보다 작게 두는 것이 핵심이다. 원래
          # 값이던 4Gi는 노드가 줄 수 있는 것보다 **컸다.** 그래서 컨테이너가
          # 자기 한도에 닿기 전에 노드가 먼저 말랐고, 그 죽음이 probe 실패를
          # 동반한 SIGTERM/Error로 나타났다 - probe 문제처럼 읽히지만 아니다.
          # 한도를 allocatable 아래로 두면 같은 초과가 이 컨테이너의 깔끔한
          # OOMKilled로 나온다. 낮게 틀리면 원인이 읽히고, 높게 틀리면 안 읽힌다.
          #
          # calico, kube-proxy, eviction threshold 몫으로 약 740Mi가 남는다.
          # 4GB 노드에서 이 위로는 여유가 많지 않다.
          resources:
            requests:
              cpu: "1500m"
              memory: 3Gi
            limits:
              cpu: "1500m"
              memory: 3Gi
          # 엔드포인트를 둘로 나눠 둔 것은 의도다:
          #   /ready   OCR 엔진이 올라오기 전까지 503
          #   /health  프로세스만 떠 있으면 엔진과 무관하게 200
          #
          # startup과 readiness는 /ready를 봐야 한다. /health를 보게 하면 즉시
          # 통과해 버려서, 엔진 초기화가 실패한 파드도 Ready로 표시되고 503밖에
          # 못 내놓는 트래픽을 받는다. 드러나야 할 실패가 오히려 숨고, 벤치마크는
          # 죽은 엔진을 측정하게 된다.
          #
          # liveness는 /ready를 보면 **안 된다.** 엔진 초기화는 기동 때 한 번뿐이고
          # 재시도가 없어서, 실패한 엔진이면 파드가 무한히 재시작만 하고 진단할
          # 기회가 사라진다.
          #
          # CPU에서는 모델 로드와 워밍업 추론에 수십 초가 든다. startup probe가
          # 그 시간을 흡수해 주므로, 이후 liveness는 촘촘하게 두어도 기동 중인
          # 파드를 죽이지 않는다.
          #
          # timeoutSeconds를 셋 다 5로 둔 이유: 기본값이 1초인데, CPU가 포화된
          # 컨테이너는 아무리 가벼운 핸들러라도 1초 안에 답하지 못한다. 그 기본값
          # 때문에 이 파드가 반복해서 죽었다.
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
