apiVersion: v1
kind: ConfigMap
metadata:
  name: ocr-config
data:
  OCR_LANG: "korean"

  # 파드당 predict() 한 번. 비교 축은 파드 개수이지 파드 내부 스레드가 아니다.
  # README 5.1 참고.
  OCR_MAX_CONCURRENCY: "1"

  # 업로드 이미지의 긴 변을 이 값으로 줄인 뒤 추론한다. 0이면 끄는데, 끄면
  # 휴대폰 사진(3000~4000px)이 들어왔을 때 float32 사본이 파드 메모리를 넘겨
  # 컨테이너가 요청 처리 중에 죽는다. 클라이언트는 상태 코드도 없이 연결이
  # 끊기는 것만 본다. 벤치마크에서 입력 크기를 고정하는 역할도 겸한다.
  OCR_MAX_IMAGE_SIDE: "1600"

  OCR_WARMUP: "true"
  OCR_USE_TEXTLINE_ORIENTATION: "false"
  LOG_LEVEL: "INFO"

  # oneDNN을 끈다. paddle 3.3.1의 PIR 실행기가 이 파이프라인이 만드는 oneDNN
  # 커널을 처리하지 못해 모든 predict()가 NotImplementedError로 죽는다
  # (ConvertPirAttribute2RuntimeAttribute, onednn_instruction.cc:116).
  # 따라서 여기서 재는 수치는 전부 "oneDNN을 끈" 값이다. README 7장 참고.
  OCR_ENABLE_MKLDNN: "false"

  # 스레드 수가 둘인데 층위가 다르다. 둘 다 deployment.yaml의 CPU limit과
  # 맞춰야 한다. 안 맞추면 파드가 스레드를 10개쯤 띄우고 서로 밟는다.
  #   OMP_NUM_THREADS  OpenMP. paddle의 CPU 커널이 쓴다. 기본값이 컨테이너의
  #                    limit이 아니라 호스트 코어 수다.
  #   OCR_CPU_THREADS  paddle 자체의 cpu_threads. PaddleOCR 기본값이 10이다.
  #
  # 2가 아니라 1인 이유는 컨테이너 바깥이 아니라 안쪽에 있다. limit이 1500m인데
  # 추론 스레드 둘이 그 quota를 다 가져가면 uvicorn 이벤트 루프가 스케줄되지
  # 못한다. 그러면 /health가 응답하지 못하고 liveness probe가 타임아웃 나서,
  # 잘 돌던 파드를 kubelet이 재시작한다. 스레드 하나면 추론 중에도 서버가
  # 응답할 몫으로 약 500m가 남는다.
  # 이렇게 하면 추론은 느려진다. 응답하는 파드가 더 값어치 있다.
  OMP_NUM_THREADS: "1"
  OCR_CPU_THREADS: "1"
