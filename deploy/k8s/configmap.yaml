apiVersion: v1
kind: ConfigMap
metadata:
  name: ocr-config
data:
  # cpu / gpu:0 / auto. Pinned to cpu here so a misdetection cannot silently
  # change what is being measured.
  OCR_DEVICE: "cpu"
  OCR_LANG: "korean"

  # One predict() per pod. The comparison axis is pod count, not in-pod
  # threads - see README section 4.2.
  OCR_MAX_CONCURRENCY: "1"

  OCR_WARMUP: "true"
  OCR_USE_TEXTLINE_ORIENTATION: "false"
  LOG_LEVEL: "INFO"

  # oneDNN off: paddle 3.3.1's PIR executor cannot run the oneDNN kernels this
  # pipeline builds and every predict() dies with NotImplementedError
  # (ConvertPirAttribute2RuntimeAttribute, onednn_instruction.cc:116). CPU
  # numbers measured here are therefore "without oneDNN" - see README 7.
  OCR_ENABLE_MKLDNN: "false"

  # Two thread counts, two different layers. Both must match the CPU limit in
  # deployment.yaml or a 2-core pod runs ~10 threads that fight each other.
  #   OMP_NUM_THREADS  OpenMP, used by paddle's CPU kernels. Defaults to the
  #                    host core count, not the container's limit.
  #   OCR_CPU_THREADS  paddle's own cpu_threads. PaddleOCR defaults it to 10.
  OMP_NUM_THREADS: "2"
  OCR_CPU_THREADS: "2"
