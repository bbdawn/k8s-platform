apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ocr-bench

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml

# 레지스트리가 없다. 이미지는 노드에서 containerd의 k8s.io namespace에 이 이름
# 그대로 빌드되고, nodeSelector가 파드를 그 노드에 고정한다.
# 나중에 레지스트리를 쓰게 되면 deployment.yaml을 고치지 말고 여기에 newName을
# 지정할 것.
images:
  - name: ocr-workload
    newTag: 0.1.0-cpu
