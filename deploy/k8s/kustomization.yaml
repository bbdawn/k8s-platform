apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ocr-bench

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml

# 이미지는 cp 에 띄운 로컬 레지스트리에서 받는다. 파드가 worker 2대에 퍼져야
# 하는데(비교 축이 파드 개수다) 레지스트리가 없으면 이미지가 빌드한 노드 한 대에만
# 있어서 다른 노드에서 ErrImageNeverPull 이 난다.
#
# 주소를 deployment.yaml 이 아니라 여기에 두는 이유: 레지스트리가 바뀌어도
# 워크로드 정의는 그대로 둘 수 있다. deployment.yaml 은 'ocr-workload' 라는
# 논리 이름만 알면 된다.
images:
  - name: ocr-workload
    newName: 10.255.42.124:30500/ocr-workload
    newTag: 0.1.0-cpu
